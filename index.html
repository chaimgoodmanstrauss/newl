<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chair44</title>
<link rel="stylesheet" href="css/style.css?v=202610292041">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<div id="app">
  <aside id="panel">
    <header>
      <h1><a href="https://arxiv.org/abs/2609.24779" target="_blank" rel="noopener">Chair44</a></h1>
    </header>

    <details class="sec">
      <summary>Show</summary>
      <div class="seg" id="viewSeg">
        <button data-view="deco" title="Decorations a, b, c in their own frames (1)">Decorations</button>
        <button data-view="tile" title="One chair tile, 24 decorations (2)">Tile</button>
        <button data-view="tiling" title="Substitution applied n times (3)">Tiling</button>
      </div>
      <label class="row" id="levelRow">Substitution level <span class="val" id="levelVal"></span>
        <input type="range" id="level" min="1" max="3" step="1"></label>
      <label class="row" id="peelRow">Peel tiles away <span class="val" id="peelVal"></span>
        <input type="range" id="peel" min="0" max="0.95" step="0.01"></label>
    </details>

    <details class="sec">
      <summary>Sculpt</summary>
      <div class="seg tools" id="toolSeg">
        <button data-tool="grab" title="Grab: drag the surface around (G)">Grab</button>
        <button data-tool="vertex" title="Move vertex: drag one vertex (V)">Move vertex</button>
        <button data-tool="flip" title="Flip quad: click a triangle; it and its neighbour across the nearest edge form a quad, and the quad's diagonal is swapped (E)">Flip quad</button>
        <button data-tool="subdivide" title="Subdivide: split the clicked triangle into four (neighbours are split to match) (D)">Subdivide</button>
        <button data-tool="delvert" title="Delete vertex: remove an interior vertex and re-triangulate the hole left by its triangles (X)">Delete vertex</button>
        <button data-tool="flatten" title="Flatten: return toward the flat square (F)">Flatten</button>
      </div>
      <div class="btns">
        <button id="undo" title="Undo (⌘Z)">Undo</button>
        <button id="redo" title="Redo (⇧⌘Z)">Redo</button>
      </div>
    </details>

    <details class="sec">
      <summary>Reset Mesh</summary>
      <label class="row">Grid resolution
        <select id="res">
          <option value="2">2 × 2 (polyhedron)</option><option value="3">3 × 3</option><option value="4">4 × 4</option>
          <option value="6">6 × 6</option><option value="8">8 × 8</option><option value="12">12 × 12</option>
          <option value="16">16 × 16</option><option value="24">24 × 24</option>
          <option value="32">32 × 32</option><option value="48">48 × 48</option>
        </select></label>
      <label class="row">Start from
        <select id="preset">
          <option value="">choose…</option>
          <option value="flat">Flat</option><option value="bumps">Bumps</option>
          <option value="waves">Waves</option><option value="knob">Knob</option>
        </select></label>
      <div class="btns"><button id="regrid" title="Replace the mesh by a regular grid, keeping the shape (drops flips and refinement)">Regrid</button></div>
    </details>

    <details class="sec">
      <summary>Display</summary>
      <label class="check"><input type="checkbox" id="flat"> Flat facets</label>
      <label class="check"><input type="checkbox" id="wire"> Show mesh</label>
    </details>

    <details class="sec">
      <summary>File</summary>
      <div class="btns">
        <button id="saveStl" title="Binary STL of what is shown">Save STL</button>
      </div>
      <div class="btns">
        <button id="saveJson" title="Save the decorations as JSON">Save State</button>
        <button id="loadJson" title="Load decorations from JSON">Load State</button>
      </div>
      <input type="file" id="fileIn" accept=".json,application/json" hidden>
    </details>

  </aside>

  <main id="stage">
    <canvas id="view"></canvas>
    <div id="toast"></div>
  </main>
</div>
<script type="module" src="js/app.js?v=202610292041"></script>
</body>
</html>
